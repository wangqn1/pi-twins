[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "py-twins"
version = "0.1.0"
description = "Local AI coding tools, agent sessions, and web UI"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "py-twins" }]
dependencies = []

[project.scripts]
py-twins = "cli:main"

[tool.setuptools]
package-dir = { "" = "src" }
py-modules = ["cli"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
